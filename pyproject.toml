[project]
name = "gullak"
version = "0.1.0"
description = "Profit, loss and forecasts for handwritten kirana registers"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "fastapi>=0.115",
  "pydantic>=2.7",
  "rapidfuzz>=3.9",
  "uvicorn>=0.30",
  "python-multipart>=0.0.9",
  "google-genai>=3.2.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
